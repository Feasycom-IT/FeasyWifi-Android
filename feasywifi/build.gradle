plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace 'com.feasycom.feasywifi'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.feasycom.feasywifi"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 2036
        versionName "2.0.3.6"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        ndkVersion '29.0.13599879'
    }

    // AGP 8：BuildConfig 默认不再生成，本工程用到，显式开启
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    aaptOptions {
        noCompress "so"
    }

    packagingOptions {
        jniLibs {
            // libFeasyWiFiLibrary.so 同时来自 libs/*.aar 与 :FeasyWiFiLibrary 模块的 jni 编译产物，取其一
            pickFirst "**/libFeasyWiFiLibrary.so"
            keepDebugSymbols += ['**/*.so']
        }
        exclude 'META-INF/library_release.kotlin_module'
        exclude 'classes.dex'
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        // 抑制kotlin-android-extensions弃用警告（可选）
        disable 'DeprecatedGradlePlugin'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

